[package]
name = "tns-deid"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.8", features = ["derive"] }
globset = "0.4.15"
lopdf = "0.40.0"
quick-xml = "0.39.3"
regex = "1.10.5"
redact-core = "0.8.3"
redact-ner = "0.8.3"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
toml = "0.8.19"
walkdir = "2.5.0"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.10.1"
