[package]
name = "tns-deid"
version = "0.1.0"
edition = "2024"
default-run = "tns-deid"

[lib]
name = "tns_deid"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tns-deid-cli"
path = "src/bin/tns-deid.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.8", features = ["derive"] }
globset = "0.4.15"
lopdf = "0.40.0"
ort = "2.0.0-rc.12"
quick-xml = "0.39.3"
redact-core = "0.8.3"
redact-ner = "0.8.3"
regex = "1.10.5"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
toml = "0.8.19"
walkdir = "2.5.0"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.10.1"

[patch.crates-io]
redact-ner = { path = "../vendor/redact-ner" }
